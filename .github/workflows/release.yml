name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: macos-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The tag is the only input that varies, so it is the only one worth checking. A mismatch
      # here used to publish VERSION_NAME regardless of the tag, silently: push v0.2.0 while
      # gradle.properties still said 0.1.0-SNAPSHOT and you got another snapshot, no error.
      # Checked before the build so the failure costs seconds rather than a full macOS compile.
      - name: Validate the release
        env:
          CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
        run: |
          # `if`, not `[ -z "$x" ] && …` — GitHub runs steps under `bash -e`, and the && form
          # returns 1 when the variable IS set, failing the step exactly when all is well.
          missing=""
          if [ -z "$CENTRAL_USERNAME" ]; then missing="$missing MAVEN_CENTRAL_USERNAME"; fi
          if [ -z "$CENTRAL_PASSWORD" ]; then missing="$missing MAVEN_CENTRAL_PASSWORD"; fi
          # Without this one signAllPublications() never runs and Central rejects the upload.
          if [ -z "$SIGNING_KEY" ]; then missing="$missing SIGNING_IN_MEMORY_KEY"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

          case "$GITHUB_REF" in refs/tags/v*) ;; *) echo "Manual run; skipping the tag check." ; exit 0 ;; esac
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME wants $tag; gradle.properties says $version."
            exit 1
          fi
          case "$version" in
            *-SNAPSHOT) echo "::error::$version is a snapshot; a tag must release a final version." ; exit 1 ;;
          esac
          echo "Releasing $version."

      # A release is not the place to discover a broken test.
      - name: Test
        run: ./gradlew build allTests --stacktrace --max-workers=4

      - name: Publish to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache --max-workers=4
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          # In-memory ASCII-armored key. useGpgCmd() is not configuration-cache compatible.
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
