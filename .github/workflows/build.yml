name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS is mandatory, not a preference: the iOS targets cannot be compiled on Linux.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # `ciVerify` is defined in the root build.gradle.kts, which explains what it covers and why
      # it is not plain `build`. Short version: it is `:navbarz` only — the published artifact —
      # because a root `build` also produces the sample's distributable artifacts, which nothing
      # here consumes and which exhausted this runner's heap twice.
      #
      # The committed gradle.properties caps workers at 2 to stay friendly on a laptop; override on
      # the command line so local builds keep their setting.
      - name: Build, test and check the public ABI
        run: ./gradlew ciVerify ktfmtCheck --stacktrace --max-workers=4

      # This is the only step that links an iOS framework, and deliberately so: it links the one
      # a consumer's own build would, through the project's "Compile Kotlin Framework" phase — the
      # phase docs/ios.md tells readers to copy. It also covers iOSApp.swift and ContentView.swift,
      # which no Gradle task touches.
      - name: Build the iOS sample app
        run: |
          xcodebuild -project sample/iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
