name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS is mandatory, not a preference: the iOS targets cannot be compiled on Linux.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The committed gradle.properties caps workers at 2 to stay friendly on a laptop.
      # Override here rather than editing the file, so local builds keep their setting.
      - name: Build and test
        run: ./gradlew build allTests --stacktrace -Dorg.gradle.workers.max=4

      - name: Check public ABI
        run: ./gradlew :barz:checkKotlinAbi

      - name: Verify the library publishes
        run: ./gradlew :barz:publishToMavenLocal

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
