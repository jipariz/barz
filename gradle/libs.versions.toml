[versions]
agp = "9.4.1"
kotlin = "2.4.0"
android-compileSdk = "37"
android-minSdk = "24"
android-targetSdk = "37"
composeMultiplatform = "1.12.0"
composeMultiplatformMaterial3 = "1.12.0-alpha03"
# Adaptive on the 1.3.0 line. The old 1.2.0 pin existed only because 1.3.0 publishes no
# iosX64/uikitX64 variant and this project used to declare that target; it no longer does.
composeMultiplatformAdaptive = "1.3.0-beta02"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
kotlinxCoroutines = "1.10.2"
ktfmt = "0.27.0"
vanniktechPublish = "0.36.0"

# --- demo app only (Pokédex sample); the :barz library depends on none of these ---
ktor = "3.5.0"
kotlinxSerialization = "1.11.0"
kotlinxDatetime = "0.7.1"
coil = "3.5.0-beta01"
koin = "4.2.1"
kermit = "2.1.0"
# Blur for the glass chrome. Demo-only — :barz does not depend on a blur library and should not;
# the sample frosts its own screens with HazeInput.Content.
haze = "2.0.0"
navigation3 = "1.1.2"
navigation3Browser = "1.0.0"
navigationeventCompose = "1.1.0"
# The adaptive-navigation3 graph still pulls Kotlin-2.2-era AOSP klibs that reference
# `externrefToBoolean`, a Wasm internal newer Kotlin no longer exports — the page dies at
# instantiation. Declaring each offender directly raises it by conflict resolution; nothing
# here *forces* a version, so a future transitive bump past these wins on its own. The symptom
# is a runtime Wasm failure, so no build task catches a regression: load the page.
# `-beta02` sits above the stable 2.10.x sibling because the fix is not in a stable release yet.
androidxLifecycleAosp = "2.11.0-beta02"
androidxSavedstateAosp = "1.5.0"
androidxNavigationeventAosp = "1.1.1"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutinesSwing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinxCoroutines" }

compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMultiplatformMaterial3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
compose-material3-adaptive-navigation-suite = { module = "org.jetbrains.compose.material3:material3-adaptive-navigation-suite", version.ref = "composeMultiplatformMaterial3" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

# --- demo app only ---
compose-material-iconsExtended = { module = "org.jetbrains.compose.material:material-icons-extended", version = "1.7.3" }
compose-adaptive = { module = "org.jetbrains.compose.material3.adaptive:adaptive", version.ref = "composeMultiplatformAdaptive" }
compose-adaptive-layout = { module = "org.jetbrains.compose.material3.adaptive:adaptive-layout", version.ref = "composeMultiplatformAdaptive" }
compose-adaptive-navigation3 = { module = "org.jetbrains.compose.material3.adaptive:adaptive-navigation3", version.ref = "composeMultiplatformAdaptive" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-contentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinxJson = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
haze-blur = { module = "dev.chrisbanes.haze:haze-blur", version.ref = "haze" }
navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
navigation3-browser = { module = "com.github.terrakok:navigation3-browser", version.ref = "navigation3Browser" }
navigationevent-compose = { module = "org.jetbrains.androidx.navigationevent:navigationevent-compose", version.ref = "navigationeventCompose" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-aosp = { module = "androidx.lifecycle:lifecycle-runtime", version.ref = "androidxLifecycleAosp" }
androidx-lifecycle-common-aosp = { module = "androidx.lifecycle:lifecycle-common", version.ref = "androidxLifecycleAosp" }
androidx-lifecycle-runtimeCompose-aosp = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycleAosp" }
androidx-savedstate-aosp = { module = "androidx.savedstate:savedstate", version.ref = "androidxSavedstateAosp" }
androidx-savedstate-compose-aosp = { module = "androidx.savedstate:savedstate-compose", version.ref = "androidxSavedstateAosp" }
androidx-navigationevent-aosp = { module = "androidx.navigationevent:navigationevent", version.ref = "androidxNavigationeventAosp" }
androidx-navigationevent-compose-aosp = { module = "androidx.navigationevent:navigationevent-compose", version.ref = "androidxNavigationeventAosp" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechPublish" }
kotlinxSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktfmt = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmt" }
